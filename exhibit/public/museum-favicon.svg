<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Museum building with columns -->
  <rect x="10" y="45" width="80" height="45" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <!-- Roof/pediment -->
  <polygon points="10,45 50,20 90,45" fill="#d3d3d3" stroke="#333" stroke-width="2"/>
  <!-- Columns -->
  <rect x="20" y="45" width="5" height="35" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <rect x="37.5" y="45" width="5" height="35" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <rect x="57.5" y="45" width="5" height="35" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <rect x="75" y="45" width="5" height="35" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <!-- Base -->
  <rect x="5" y="80" width="90" height="5" fill="#a0a0a0" stroke="#333" stroke-width="1"/>
  <!-- Museum artifact (vase) in the middle -->
  <ellipse cx="50" cy="60" rx="8" ry="5" fill="#bf8040" stroke="#333" stroke-width="1"/>
  <path d="M45,60 C45,50 55,50 55,60" fill="#bf8040" stroke="#333" stroke-width="1"/>
</svg> 