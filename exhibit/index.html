    <!-- Handle SPA routing for deployed app -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages or static hosts
      // Works on Vercel, Netlify, GitHub Pages, etc.
      (function(l) {
        if (navigator.userAgent.indexOf('MSIE') !== -1 || 
            navigator.appVersion.indexOf('Trident/') > -1) {
          // IE10+ special cases
          return;
        }
        
        var origin = window.location.origin;
        var path = window.location.pathname.split('/');
        var redirectedFrom = sessionStorage.redirect;
        delete sessionStorage.redirect;
        
        if (redirectedFrom && redirectedFrom !== l.href) {
          history.replaceState(null, null, redirectedFrom);
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Fallback for 404 pages on static hosting services -->
    <script>
      // Redirect 404s to the main app where React Router can handle them
      if (window.location.pathname !== '/' && !window.location.pathname.includes('.')) {
        sessionStorage.redirect = window.location.href;
      }
    </script>
